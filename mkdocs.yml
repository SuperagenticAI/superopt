site_name: SuperOpt
site_description: Agentic Environment Optimization for Autonomous AI Agents
site_author: Shashi Jagtap
site_url: https://superagenticai.github.io/superopt/

# Repository
repo_url: https://github.com/SuperagenticAI/superopt
repo_name: superopt
edit_uri: edit/main/docs/

# Copyright
copyright: |
  <div style="text-align: center;">
    <a href="https://super-agentic.ai/" target="_blank" rel="noopener" style="color: var(--md-accent-fg-color); text-decoration: none; font-weight: 500;">
      Built by Superagentic AI
    </a>
  </div>
  <div style="text-align: center; margin-top: 0.5rem; font-size: 0.875rem; color: var(--md-default-fg-color--light);">
    Copyright &copy; 2025 Superagentic AI
  </div>

# Theme Configuration
theme:
  name: material
  language: en

  # Logo and favicon
  logo: assets/SuperOpt_logo.png
  favicon: assets/SuperOpt_favicon.png

  # Color scheme
  palette:
    - scheme: default
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
      primary: deep-purple
      accent: deep-purple
    - scheme: slate
      toggle:
        icon: material/toggle-switch-off
        name: Switch to light mode
      primary: black
      accent: deep-purple

  # Features
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.footnote.tooltips
    - content.tabs.link
    - content.tooltips
    - header.autohide
    - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.prune
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    - toc.integrate

  # Custom icons
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
    previous: fontawesome/solid/angle-left
    next: fontawesome/solid/angle-right

# Plugins
plugins:
  - search:
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - minify:
      minify_html: true
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            docstring_style: google
            docstring_section_style: table
            heading_level: 1
            inherited_members: true
            merge_init_into_class: true
            separate_signature: true
            show_bases: true
            show_category_heading: true
            show_docstring_attributes: true
            show_docstring_functions: true
            show_docstring_classes: true
            show_docstring_modules: true
            show_if_no_docstring: true
            show_inheritance_diagram: true
            show_labels: true
            show_object_full_path: true
            show_root_full_path: true
            show_root_heading: true
            show_root_toc_entry: true
            show_signature: true
            show_signature_annotations: true
            show_source: false
            show_submodules: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true
            summary: true

# Extensions
markdown_extensions:
  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - meta
  - tables
  - toc:
      permalink: true
      permalink_title: Anchor link to this section for reference

  # Python Markdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: SuperagenticAI
      repo: superopt
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Extra configuration
extra:
  generator: false
  version:
    provider: mike
    default: latest
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/SuperagenticAI/superopt
      name: GitHub Repository
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/superopt/
      name: PyPI Package
extra_css:
  - stylesheets/extra.css

# Page tree
nav:
  - 🏠 Home: index.md
  - 🚀 Getting Started: getting-started/installation.md
  - 💡 Concepts: concepts/overview.md
  - 🧩 Components: components/overview.md
  - 🏛️ Architecture: architecture/system-overview.md
  - 🔌 Examples: integration/overview.md
  - 📚 API: api/core.md
  - 🔬 Research: comparison/overview.md
